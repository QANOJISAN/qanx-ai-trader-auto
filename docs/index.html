<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#0b1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<title>Auth Lock Vault</title>
<style>
  :root {
    --bg-main: #070d19;
    --bg-card: #10192b;
    --bg-inner: #162238;
    --border: #233454;
    --accent: #0ea5e9;
    --text-main: #f1f5f9;
    --text-sub: #94a3b8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { background: radial-gradient(circle at top, #0f203c 0%, var(--bg-main) 70%); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px; }
  .lock-card { width: 100%; max-width: 410px; background: rgba(16, 25, 43, 0.94); border: 1px solid var(--border); border-radius: 22px; padding: 28px 22px; box-shadow: 0 20px 50px rgba(0,0,0,0.65); }
  .lock-header { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
  .logo-box { width: 54px; height: 54px; border-radius: 15px; background: linear-gradient(135deg, #0284c7, #0d9488); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 20px; color: #fff; flex-shrink: 0; box-shadow: 0 4px 14px rgba(14,165,233,0.35); }
  .lock-title { font-size: 20px; font-weight: 800; line-height: 1.3; color: #fff; }
  .lock-sub { font-size: 12px; color: var(--text-sub); margin-top: 4px; line-height: 1.4; }
  .badge-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 22px; }
  .sec-pill { font-size: 11px; font-weight: 700; color: #38bdf8; background: rgba(14, 165, 233, 0.12); border: 1px solid rgba(56, 189, 248, 0.3); padding: 5px 11px; border-radius: 8px; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
  .field-label { font-size: 13px; font-weight: 700; color: #cbd5e1; margin-bottom: 8px; display: block; }
  .input-wrap { position: relative; margin-bottom: 16px; }
  .pass-input { width: 100%; background: #091120; border: 1.5px solid #1e3a5f; border-radius: 12px; padding: 14px 44px 14px 14px; color: #fff; font-size: 15px; outline: none; }
  .pass-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(14,165,233,0.2); }
  .eye-btn { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text-sub); font-size: 18px; cursor: pointer; padding: 4px; }
  .remember-box { background: rgba(22, 34, 56, 0.75); border: 1px solid var(--border); border-radius: 12px; padding: 13px; display: flex; align-items: flex-start; gap: 11px; margin-bottom: 20px; cursor: pointer; }
  .remember-box input { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--accent); flex-shrink: 0; }
  .rem-title { font-size: 13px; font-weight: 700; color: #e2e8f0; line-height: 1.4; }
  .rem-desc { font-size: 11.5px; color: var(--text-sub); margin-top: 5px; line-height: 1.45; }
  .unlock-btn { width: 100%; background: linear-gradient(90deg, #0284c7, #0d9488); border: none; border-radius: 12px; padding: 15px; color: #fff; font-size: 15px; font-weight: 800; cursor: pointer; box-shadow: 0 6px 20px rgba(13, 148, 136, 0.35); display: flex; align-items: center; justify-content: center; gap: 8px; }
  .err-msg { color: #f87171; font-size: 12.5px; font-weight: 600; margin-top: 12px; text-align: center; display: none; }
  .lock-footer { border-top: 1px solid var(--border); margin-top: 22px; padding-top: 14px; font-size: 11px; color: #64748b; line-height: 1.55; }
  #appView { display: none; width: 100%; max-width: 600px; padding-bottom: 36px; }
  .top-bar { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 14px 16px; margin-bottom: 12px; display: flex; flex-direction: column; gap: 10px; }
  .top-row1 { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .app-title { font-size: 16px; font-weight: 800; color: #fff; }
  .btn-group { display: flex; gap: 6px; }
  .mini-btn { background: var(--bg-inner); border: 1px solid var(--border); color: #e2e8f0; font-size: 11.5px; font-weight: 700; padding: 6px 10px; border-radius: 8px; cursor: pointer; }
  .mini-btn.lock { border-color: rgba(245,158,11,0.4); color: #fbbf24; }
  .status-pills { display: flex; flex-wrap: wrap; gap: 6px; }
  .st-badge { font-size: 10.5px; font-weight: 800; padding: 4px 9px; border-radius: 6px; }
  .st-live { background: rgba(239,68,68,0.18); color: #fca5a5; border: 1px solid rgba(239,68,68,0.4); }
  .st-run { background: rgba(16,185,129,0.18); color: #6ee7b7; border: 1px solid rgba(16,185,129,0.4); }
  .st-chain { background: rgba(14,165,233,0.15); color: #7dd3fc; border: 1px solid rgba(14,165,233,0.35); }
  .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 15px; margin-bottom: 12px; }
  .card-title { font-size: 13px; font-weight: 800; color: #cbd5e1; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
  .prog-track { width: 100%; height: 11px; background: #091120; border-radius: 99px; overflow: hidden; margin: 8px 0; border: 1px solid var(--border); }
  .prog-fill { height: 100%; background: linear-gradient(90deg, #10b981, #0ea5e9); border-radius: 99px; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
  .metric-box { background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; padding: 13px; }
  .m-label { font-size: 11px; color: var(--text-sub); font-weight: 700; }
  .m-val { font-size: 18px; font-weight: 800; margin: 5px 0 3px; color: #fff; }
  .m-sub { font-size: 10.5px; color: #64748b; }
  .tier-row { border-top: 1px solid rgba(35,52,84,0.7); padding: 10px 0; display: flex; justify-content: space-between; align-items: center; font-size: 12px; }
  .tier-row:first-of-type { border-top: none; padding-top: 4px; }
  .tier-name { font-weight: 800; color: #e2e8f0; }
  .tier-sub { font-size: 10.5px; color: var(--text-sub); margin-top: 2px; }
  .tier-right { text-align: right; font-family: ui-monospace, monospace; }
</style>
</head>
<body>

<div class="lock-card" id="lockView">
  <div class="lock-header">
    <div class="logo-box">QT</div>
    <div>
      <div class="lock-title">🔒 AI Trader v2 認証ロック</div>
      <div class="lock-sub">ゼロ知識クライアント復号型 全自動スイング＆防衛台帳</div>
    </div>
  </div>
  <div class="badge-row">
    <span class="sec-pill">AES-256-GCM</span>
    <span class="sec-pill">PBKDF2-SHA256 (600,000回)</span>
    <span class="sec-pill">noindex / 完全暗号化</span>
  </div>
  <label class="field-label" for="passInput">復号パスワードを入力</label>
  <div class="input-wrap">
    <input type="password" id="passInput" class="pass-input" placeholder="パスワードを入力..." autocomplete="current-password">
    <button type="button" class="eye-btn" id="eyeBtn" aria-label="表示切替">👁️</button>
  </div>
  <label class="remember-box">
    <input type="checkbox" id="remCheck" checked>
    <div>
      <div class="rem-title">✅ この端末（ブラウザ）にロック解除状態を記憶する</div>
      <div class="rem-desc">次回からホーム画面アイコンをタップするだけで0.5秒で即起動します（ヘッダーの「🔒 今すぐロック」でいつでも解除可能）</div>
    </div>
  </label>
  <button type="button" class="unlock-btn" id="unlockBtn">🔓 ロック解除して台帳を開く</button>
  <div class="err-msg" id="errMsg">❌ パスワードが正しくありません。</div>
  <div class="lock-footer">
    ※ 本HTMLには平文の取引データ・銘柄名・ウォレットアドレスは1文字も含まれていません。パスワードから導出した鍵によりブラウザのメモリ上（Web Crypto API）でのみ復号されます。
  </div>
</div>

<div id="appView"></div>

function b64ToBytes(b64) {
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return arr;
}

async function decryptData(password) {
  const enc = new TextEncoder();
  const keyMaterial = await crypto.subtle.importKey(
    "raw", enc.encode(password), { name: "PBKDF2" }, false, ["deriveKey"]
  );
  const key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: b64ToBytes(ENC_PAYLOAD.salt), iterations: ENC_PAYLOAD.iter, hash: "SHA-256" },
    keyMaterial,
    { name: "AES-GCM", length: 256 },
    false,
    ["decrypt"]
  );
  const plainBuf = await crypto.subtle.decrypt(
    { name: "AES-GCM", iv: b64ToBytes(ENC_PAYLOAD.iv) },
    key,
    b64ToBytes(ENC_PAYLOAD.ct)
  );
  return JSON.parse(new TextDecoder().decode(plainBuf));
}

function fmtNum(n, d = 0) {
  const v = Number(n || 0);
  return v.toLocaleString("ja-JP", { minimumFractionDigits: d, maximumFractionDigits: d });
}

      <div class="card-title">
        <span>🎯 税引後純キャッシュ 4,000万円 目標進捗</span>
        <span style="color:#34d399;font-size:11px;">恒等式: ${fmtNum(totalBook)}円 (完全一致)</span>
      </div>
      <div class="prog-track"><div class="prog-fill" style="width:${goalPct.toFixed(2)}%"></div></div>
      <div style="display:flex;justify-content:space-between;font-size:11.5px;color:#cbd5e1;">
        <span>現在有効資産: <b>${fmtNum(totalValueJpy)} 円</b> (${goalPct.toFixed(2)}%)</span>
        <span>目標: 40,000,000 円</span>
      </div>
    </div>

    <div class="grid-2">
      <div class="metric-box">
        <div class="m-label">① 納税準備枠 (55.945%隔離)</div>
        <div class="m-val" style="color:#f87171;">${fmtNum(st.tax_reserve_jpy || 0)} 円</div>
        <div class="m-sub">支払済税金累計: ${fmtNum(st.tax_paid_jpy || 0)} 円</div>
      </div>
      <div class="metric-box">
        <div class="m-label">② 純キャッシュ確定枠</div>
        <div class="m-val" style="color:#34d399;">${fmtNum(st.net_cash_jpy || 0)} 円</div>
        <div class="m-sub">Cold Vault隔離済: ${fmtNum(st.swept_vault_jpy || 0)} 円</div>
      </div>
      <div class="metric-box">
        <div class="m-label">③ 買戻し待機枠 (AIホット残)</div>
        <div class="m-val" style="color:#38bdf8;">${fmtNum(st.rebuy_pool_jpy || 0)} 円</div>
        <div class="m-sub">DUST: ${st.dust_status || "CLEAN"}</div>
      </div>
      <div class="metric-box">
        <div class="m-label">📊 2系列取得単価 (P_cost)</div>
        <div class="m-val" style="font-size:16px;">${pCost.toFixed(6)} 円</div>
        <div class="m-sub">現在: <b style="color:#e2e8f0;">${priceJpy.toFixed(4)}円</b> (原価差: <span style="color:${priceJpy >= pCost ? '#34d399' : '#f87171'};">${(priceJpy - pCost >= 0 ? '+' : '') + (priceJpy - pCost).toFixed(4)}円 / ${(((priceJpy - pCost) / pCost) * 100).toFixed(1)}%</span>)</div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">
        <span>🔒 ${ui.core_header || 'Wallet ①: コア枠'} (簿価 ${fmtNum(coreBook)}円)</span>
      </div>
      <div style="font-size:11px;color:#fbbf24;margin-bottom:8px;">
        🔒 2028/01/01 00:00:00 JST 解禁まで完全タイムロック中 (残 ${fmtNum(sched.days_until_unlock || 434, 1)} 日)
      </div>
      ${coreTiers.map(t => `
        <div class="tier-row">
          <div>
            <div class="tier-name">${t.tier_id || t.tranche_id || t.id || ""}</div>
            <div class="tier-sub">${t.label || "2028年解禁ロック枠"}</div>
          </div>
          <div class="tier-right">
            <div style="color:#fff;font-weight:700;">${fmtNum((t.qty_qanx ?? t.current_qty_qanx ?? t.qty ?? 0))} 枚 (${fmtNum((t.book_jpy ?? t.book_value_jpy ?? t.allocated_book_jpy ?? 0))}円)</div>
            <div style="font-size:10.5px;color:#fbbf24;">@${Number((t.target_jpy ?? t.target_price_jpy ?? t.unlock_price_jpy ?? 0)||0).toFixed(2)}円 / ${t.status}</div>
          </div>
        </div>
      `).join("")}
    </div>

    <div class="card">
      <div class="card-title">
        <span>⚡ ${ui.ai_header || 'Wallet ②: AIスイング枠'} (簿価 ${fmtNum(aiBook)}円)</span>
      </div>
      ${aiTiers.map(t => `
        <div class="tier-row">
          <div>
            <div class="tier-name">${t.tier_id || t.tranche_id || t.id || ""}</div>
            <div class="tier-sub">${t.label || "AI自動スイング枠"}</div>
          </div>
          <div class="tier-right">
            <div style="color:#fff;font-weight:700;">${fmtNum((t.qty_qanx ?? t.current_qty_qanx ?? t.qty ?? 0))} 枚 (${fmtNum((t.book_jpy ?? t.book_value_jpy ?? t.allocated_book_jpy ?? 0))}円)</div>
            <div style="font-size:10.5px;color:#34d399;">@${Number((t.target_jpy ?? t.target_price_jpy ?? t.unlock_price_jpy ?? 0)||0).toFixed(2)}円 / ${t.status}</div>
          </div>
        </div>
      `).join("")}
    </div>

    <div class="card">
      <div class="card-title">🛡️ 5段階サーキットブレーカー (L1〜L5) 防衛状態</div>
      ${cbList.map(c => `
        <div class="tier-row">
          <div>
            <div class="tier-name">${c.level}: ${c.title || c.name || ""}</div>
            <div class="tier-sub">${c.detail || "正常監視中"}</div>
          </div>
          <div class="tier-right">
            <span class="st-badge st-run">${c.status || "CLEAR"}</span>
          </div>
        </div>
      `).join("")}
    </div>
  `;

  document.getElementById("lockView").style.display = "none";
  app.style.display = "block";
  document.getElementById("lockNowBtn").addEventListener("click", () => {
    localStorage.removeItem(STORAGE_KEY);
    app.style.display = "none";
    app.innerHTML = "";
    document.getElementById("passInput").value = "";
    document.getElementById("lockView").style.display = "block";
  });
}

async function tryUnlock(pass, saveIfOk) {
  const errEl = document.getElementById("errMsg");
  errEl.style.display = "none";
  try {
    const data = await decryptData(pass);
    if (saveIfOk) {
      localStorage.setItem(STORAGE_KEY, pass);
    } else {
      localStorage.removeItem(STORAGE_KEY);
    }
    renderDashboard(data);
  } catch (e) {
    localStorage.removeItem(STORAGE_KEY);
    errEl.style.display = "block";
  }
}

document.getElementById("eyeBtn").addEventListener("click", () => {
  const inp = document.getElementById("passInput");
  inp.type = inp.type === "password" ? "text" : "password";
});

document.getElementById("unlockBtn").addEventListener("click", () => {
  const pass = document.getElementById("passInput").value;
  const rem = document.getElementById("remCheck").checked;
  if (pass) tryUnlock(pass, rem);
});

document.getElementById("passInput").addEventListener("keydown", (e) => {
  if (e.key === "Enter") document.getElementById("unlockBtn").click();
});

window.addEventListener("DOMContentLoaded", () => {
  const saved = localStorage.getItem(STORAGE_KEY);
  if (saved) {
    tryUnlock(saved, true);
  }
});
</script>
</body>
</html>
